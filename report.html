 should mirror the difficulty distribution of production, not the frequency distribution.\"\n    },\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s27\",\n      \"quote\": \"Mỗi ô là một tình huống khác nhau — con người quyết ô nào đáng test.\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m04\",\n      \"section_id\": \"key-takeaways-and-definitions\",\n      \"quote\": \"User Input Grid (UIG) — A structured methodology used to generate a diverse and realistic set of user queries.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Bạn có thể giải thích thêm về cách xác định các trục trong User Input Grid không?\",\n    \"Làm thế nào để đảm bảo rằng các trường hợp kiểm tra trong UIG thực sự phản ánh thực tế người dùng?\",\n    \"Có những phương pháp nào khác để đánh giá độ đa dạng của dữ liệu kiểm tra trong AI evaluations?\"\n  ]\n}", "latency_s": 4.89, "cost_usd": 0.00081075, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-04-in-eval-levels-synthesis", "input": "So sánh ranh giới kỹ thuật giữa Level 1 (Unit Tests) và Level 2 (Human & Model Eval) theo Hamel Husain, tại sao một team làm AI không nên nhảy cóc lên Level 2 khi chưa có Level 1 vững?", "slide": null, "output": {"scope": "in_scope", "answer": "Theo Hamel Husain, Level 1 (Unit Tests) là các bài kiểm tra nhanh và rẻ, giúp phát hiện lỗi trong mã nguồn ngay khi có thay đổi. Chúng cần thiết để đảm bảo rằng các chức năng cơ bản của hệ thống hoạt động đúng. Ngược lại, Level 2 (Human & Model Eval) yêu cầu một nền tảng vững chắc từ Level 1, vì nó liên quan đến việc đánh giá phức tạp hơn mà không thể chỉ dựa vào các khẳng định đơn giản. Nếu một team nhảy cóc lên Level 2 mà không có Level 1 vững, họ có thể bỏ lỡ các lỗi cơ bản, dẫn đến việc đánh giá không chính xác và tốn thời gian hơn trong việc sửa chữa sau này.", "sources": [{"doc_id": "hamel-evals", "section_id": "level-1-unit-tests", "quote": "Unit tests for LLMs are assertions... should run fast and cheaply as you develop your application."}, {"doc_id": "hamel-evals", "section_id": "level-2-human-model-eval", "quote": "After you have built a solid foundation of Level 1 tests, you can move on to other forms of validation that cannot be tested by assertions alone."}, {"doc_id": "hamel-evals", "section_id": "the-types-of-evaluation", "quote": "It's also helpful to conquer a good portion of your Level 1 tests before you move into model-based tests."}], "followup_questions": ["Bạn có thể nêu ví dụ về một số loại lỗi mà Level 1 có thể phát hiện không?", "Tại sao việc đánh giá người dùng lại quan trọng trong Level 2?", "Có những phương pháp nào khác để thực hiện đánh giá AI ngoài Level 1 và Level 2?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Theo Hamel Husain, Level 1 (Unit Tests) là các bài kiểm tra nhanh và rẻ, giúp phát hiện lỗi trong mã nguồn ngay khi có thay đổi. Chúng cần thiết để đảm bảo rằng các chức năng cơ bản của hệ thống hoạt động đúng. Ngược lại, Level 2 (Human & Model Eval) yêu cầu một nền tảng vững chắc từ Level 1, vì nó liên quan đến việc đánh giá phức tạp hơn mà không thể chỉ dựa vào các khẳng định đơn giản. Nếu một team nhảy cóc lên Level 2 mà không có Level 1 vững, họ có thể bỏ lỡ các lỗi cơ bản, dẫn đến việc đánh giá không chính xác và tốn thời gian hơn trong việc sửa chữa sau này.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"hamel-evals\",\n      \"section_id\": \"level-1-unit-tests\",\n      \"quote\": \"Unit tests for LLMs are assertions... should run fast and cheaply as you develop your application.\"\n    },\n    {\n      \"doc_id\": \"hamel-evals\",\n      \"section_id\": \"level-2-human-model-eval\",\n      \"quote\": \"After you have built a solid foundation of Level 1 tests, you can move on to other forms of validation that cannot be tested by assertions alone.\"\n    },\n    {\n      \"doc_id\": \"hamel-evals\",\n      \"section_id\": \"the-types-of-evaluation\",\n      \"quote\": \"It's also helpful to conqu  có thể triệt tiêu một phần verbosity bias?", "slide": null, "output": {"scope": "in_scope", "answer": "Ba thiên kiến cốt lõi ở LLM Judge bao gồm:\n1. **Positional Bias**: Xu hướng đánh giá dựa trên vị trí của thông tin trong đầu ra, có thể dẫn đến việc bỏ qua các yếu tố quan trọng nếu chúng không nằm ở vị trí nổi bật.\n2. **Verbosity Bias**: Xu hướng đánh giá cao các đầu ra dài dòng hơn, mặc dù chúng có thể không cung cấp thông tin tốt hơn. Điều này có thể được giảm thiểu bằng cách sử dụng few-shot rubric, vì nó cung cấp các ví dụ cụ thể về cách diễn đạt ngắn gọn và hiệu quả.\n3. **Self-enhancement Bias**: Xu hướng mà LLM có thể đánh giá cao hơn khả năng của chính nó, dẫn đến việc đưa ra các quyết định không chính xác.\n\nFew-shot rubric giúp triệt tiêu một phần verbosity bias bằng cách cung cấp các ví dụ rõ ràng về đầu ra mong muốn, từ đó hướng dẫn LLM tạo ra các phản hồi ngắn gọn và chính xác hơn.", "sources": [{"doc_id": "ai-evals-m07", "section_id": "lesson-1-principles-of-llm-judge-design", "quote": "LLM-as-judge must be used in extremely narrow, well-defined ways."}, {"doc_id": "ai-evals-m09", "section_id": "step-4-read-the-disagreements", "quote": "The judge defaults to Pass on ambiguous cases."}, {"doc_id": "ai-evals-m10", "section_id": "lever-1-prompt-engineering", "quote": "Adding a few-shot examples from the golden dataset for underperforming scenarios."}], "followup_questions": ["Bạn có thể giải thích thêm về cách mà positional bias ảnh hưởng đến đánh giá của LLM không?", "Làm thế nào để thiết kế một few-shot rubric hiệu quả cho LLM Judge?", "Có những phương pháp nào khác để giảm thiểu self-enhancement bias trong LLM?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Ba thiên kiến cốt lõi ở LLM Judge bao gồm:\\n1. **Positional Bias**: Xu hướng đánh giá dựa trên vị trí của thông tin trong đầu ra, có thể dẫn đến việc bỏ qua các yếu tố quan trọng nếu chúng không nằm ở vị trí nổi bật.\\n2. **Verbosity Bias**: Xu hướng đánh gi    (o.sources||[]).forEach(function(s){h+='<div class="src"><code>'+esc(s.doc_id)+'#'+esc(s.section_id)+'</code> — “'+esc(s.quote)+'”</div>'});
   if(o.followup_questions)h+='<div style="margin-top:6px"><b>Gợi ý hỏi tiếp:</b></div>'+o.followup_questions.map(function(q){return '<div class="fu">• '+esc(q)+'</div>'}).join("");}
  h+='<div style="margin-top:10px">'+badge(r.verdict)+' <span class="rat">'+esc(r.rationale)+'</span></div>'+
  '<div class="lbl" style="margin-top:8px">Nhãn người: '+["pass","fail","uncertain"].map(function(v){
   return '<button data-i="'+i+'" data-v="'+v+'" class="'+(lbl==v?"on":"")+'" onclick="setLabel(this)">'+v+'</button>'}).join(" ")+
  ' <input type="text" class="note" data-i="'+i+'" placeholder="note ngắn (vd: fail vì citation)" value="'+esc(c.note)+'" onchange="setNote(this)">'+
  ' <button data-i="'+i+'" onclick="raw(this)">xem raw</button></div>'+
  '<div class="raw">'+esc(r.raw_content||JSON.stringify(o,null,2))+'</div></div>';});
 el.innerHTML=h||"<p>Không có dòng nào khớp bộ lọc.</p>";
 document.getElementById("stat").textContent=n+"/"+ROWS.length+" dòng";}
function setLabel(b){var r=ROWS[b.dataset.i],c=cur(r.scenario_id,r.human_label);
 if(c.label==b.dataset.v){if(c.note)saved[r.scenario_id]={label:"",note:c.note};else delete saved[r.scenario_id]}
 else saved[r.scenario_id]={label:b.dataset.v,note:c.note};
 localStorage.setItem(KEY,JSON.stringify(saved));render();}
function setNote(inp){var r=ROWS[inp.dataset.i],c=cur(r.scenario_id,r.human_label),n=inp.value.trim();
 if(!n&&!c.label)delete saved[r.scenario_id];else saved[r.scenario_id]={label:c.label,note:n};
 localStorage.setItem(KEY,JSON.stringify(saved));}
function raw(b){var d=b.closest(".card").querySelector(".raw");d.style.display=d.style.display=="block"?"none":"block";}
function exportCsv(){var s="scenario_id,label,note\n";
 function q(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}
 ROWS.forEach(function(r){var c=cur(r.scenario_id,r.human_label);
  s+=q(r.scenario_id)+","+q(c.label)+","+q(c.note)+"\n"});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));
 a.download="labels.csv";a.click();}
document.getElementById("flt").onchange=render;render();
</script></body></html>
